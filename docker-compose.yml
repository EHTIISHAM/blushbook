# Runs on the VM, not locally. Pulls the image GitHub Actions built.
#
# Caddy fronts everything on this server, not just Blushbook. It runs on the
# host network so that 127.0.0.1 inside the Caddyfile means the host — the same
# thing it meant when Caddy was installed directly on the box. That keeps any
# other app already listening on a local port working untouched.
#
# Lives at /opt/blushbook/docker-compose.yml alongside a .env file.
# See DEPLOY.md.

services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    # Bound to loopback only: reachable by Caddy on the host, not from the
    # internet. Never change this to "3000:3000" — that publishes the app
    # on every interface and bypasses Caddy, and with it HTTPS.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    # Host networking: Caddy binds 80/443 on the host directly, so no "ports"
    # mapping here, and upstreams are addressed as 127.0.0.1:<port>.
    network_mode: host
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      OTHER_SITE_DOMAIN: ${OTHER_SITE_DOMAIN:-}
      OTHER_SITE_UPSTREAM: ${OTHER_SITE_UPSTREAM:-127.0.0.1:5000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Holds the TLS certificates. Losing this means re-issuing them, and
  # Let's Encrypt rate limits how often you may do that.
  caddy_data:
  caddy_config:
